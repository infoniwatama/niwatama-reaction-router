name: reaction-poll
# Slackリアクション→Notion反映を5分ごとに巡回（PCオフでもGitHubのクラウドで動く）
on:
  schedule:
    - cron: '2-59/5 * * * *'   # 5分ごと（GH Actionsの最短間隔・多少の遅延はある）
  workflow_dispatch: {}       # 手動実行も可

concurrency:
  group: reaction-poll        # 多重起動を防ぐ
  cancel-in-progress: false

permissions:
  contents: write             # state/processed.json をコミットバックするため

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Poll reactions
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node poll.js --apply
      - name: Commit processed state if changed
        run: |
          if [ -n "$(git status --porcelain state/processed.json)" ]; then
            git config user.name  "reaction-poll-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/processed.json
            git commit -m "state: processed reactions [skip ci]"
            git push
          else
            echo "no state change"
          fi

